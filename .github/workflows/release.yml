name: Windows build
# Builds dist/abSCADA-<version>-windows.zip on a Windows runner.
# - Manual run (Actions → Windows build → Run workflow): ZIP available as a workflow artifact.
# - Tag push v* (e.g. v0.5.0b1): also attached to a GitHub Release (marked pre-release for betas).
#   Creating the release on github.com with a new v* tag works too: the ZIP is added to it.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # signed build provenance (Sigstore)
  attestations: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re
          version = re.search(r'__version__ = "([^"]+)"', open("src/abscada/__init__.py", encoding="utf-8").read()).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == "v" + version, f"La etiqueta {tag} no coincide con la versión del código {version}: usa tools/release.py"
      - run: python -m pip install -r requirements-lock.txt -e ".[dev,s7,modbus,opcua]" pyinstaller
      - name: Tests before packaging
        run: python -m pytest -q
      - name: Build executable
        run: python packaging/build_exe.py
      - name: Smoke test of the packaged helper modes
        shell: python
        run: |
          import json, subprocess
          exe = r"dist\abSCADA\abscada.exe"
          request = dict(source="ctx.write('A', ctx.read('B') + 1)", filename="t.py", event="startup",
                         samples={"B": dict(value=1, quality="good")})
          out = subprocess.run([exe, "--script-runner"], input=json.dumps(request), capture_output=True,
                               text=True, timeout=120).stdout
          assert json.loads(out)["actions"] == [["A", 2]], out
          print("script runner OK")
      # IEC 62443-4-1 SM-6/SUM-4 and CRA: a component list, checksums and verifiable origin per release.
      - name: SBOM and checksums
        shell: bash
        run: |
          python -m pip install -q cyclonedx-bom
          cyclonedx-py environment "$(python -c 'import sys; print(sys.executable)')" --of JSON -o dist/sbom.cdx.json
          cd dist && sha256sum abSCADA-*-windows.zip sbom.cdx.json > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build provenance (verify with gh attestation verify <zip> --repo <owner>/<repo>)
        # Free for public repositories; private ones need GitHub Enterprise Cloud.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/abSCADA-*-windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: abSCADA-windows
          path: |
            dist/abSCADA-*-windows.zip
            dist/sbom.cdx.json
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: the CHANGELOG.md section of this version (written by tools/release.py), plus how
          # to verify the download. A tag created by hand without that section falls back to BETA.md.
          if python tools/release.py notes "$GITHUB_REF_NAME" > notes.md 2>/dev/null; then :; else cp docs/BETA.md notes.md; fi
          cat >> notes.md <<EOF

          ---
          **Descarga:** \`abSCADA-${GITHUB_REF_NAME#v}-windows.zip\` · descomprimir y ejecutar \`abscada.exe\`. Guía de prueba: [docs/BETA.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/BETA.md).

          **Verificar la descarga:** \`sha256sum -c SHA256SUMS.txt\`. Componentes incluidos: \`sbom.cdx.json\` (CycloneDX).
          EOF
          if [ "${{ github.event.repository.visibility }}" = "public" ]; then
            echo "Procedencia firmada: \`gh attestation verify abSCADA-${GITHUB_REF_NAME#v}-windows.zip --repo ${GITHUB_REPOSITORY}\`." >> notes.md
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *a*|*b*|*rc*) flags="--prerelease";; esac
          # The release may already exist when it was drafted on github.com (that creates the tag).
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/abSCADA-*-windows.zip dist/sbom.cdx.json dist/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/abSCADA-*-windows.zip dist/sbom.cdx.json dist/SHA256SUMS.txt $flags \
              --title "abSCADA $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
