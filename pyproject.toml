[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abscada"
version = "0.5.0b2"
description = "Modular desktop SCADA editor and runtime"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
s7 = ["python-snap7>=3.2,<4"]
modbus = ["pyModbusTCP>=0.3,<0.4"]
# asyncua 2.1 is the first release that works on Python 3.14 (deferred annotations).
opcua = ["asyncua>=2.1,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
abscada = "abscada.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abscada = ["standard_library/*.json", "standard_library/*/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
